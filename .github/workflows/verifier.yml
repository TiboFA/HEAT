# Les vérifications de livraison, à chaque push et chaque pull request.
# Même commande qu'en local : python3 outils/verifier.py
name: verifier
on:
  push:
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python outils/verifier.py
