# Publie le jeu sur GitHub Pages à chaque push sur main.
# La page d'accueil du site est jeu/jeu.html ; les versions archivées restent
# accessibles sous leur nom (…/HEAT_jeu_v0.13.html).
#
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site
          cp jeu/*.html _site/
          cp jeu/jeu.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
